{% extends "base.html" %}

{% block title %}Главная{% endblock %}
{% block heading %}Главная{% endblock %}

{% block content %}
{% if user.is_authenticated %}
<p class="muted">Вы вошли как {{ user.username }}.</p>
<p><a class="button" href="{% url 'profile' %}">Перейти в профиль</a></p>
{% else %}
<p class="muted">Вы не авторизованы.</p>
<p><a class="button" href="{% url 'register' %}">Зарегистрироваться</a></p>
{% endif %}
{% endblock %}
