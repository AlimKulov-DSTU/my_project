{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Пользователи{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a class="nav__brand" href="{% url 'home' %}">Users</a>
            <div class="nav__links">
                <a href="{% url 'home' %}">Главная</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}">Мой профиль</a>
                    <a href="{% url 'user_list' %}">Пользователи</a>
                    <a href="{% url 'password_change' %}">Сменить пароль</a>
                    <form method="post" action="{% url 'logout' %}" class="inline-form">
                        {% csrf_token %}
                        <button type="submit" class="button button--ghost">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="page">
        <section class="panel">
            <h1>{% block heading %}Пользователи{% endblock %}</h1>
            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
